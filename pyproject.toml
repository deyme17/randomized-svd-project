[project]
name = "randomized-svd-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "huggingface-hub>=1.32.0",
    "matplotlib>=3.11.2",
    "memory-profiler>=0.61.0",
    "numba>=0.67.0",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "pynvml>=13.0.1",
    "safetensors>=0.8.0",
    "scipy>=1.17.1",
    "torch>=2.4.0",
    "transformers>=5.17.0",
]

[dependency-groups]
dev = []

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
